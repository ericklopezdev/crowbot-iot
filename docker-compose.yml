# Local development stack: Postgres + Mosquitto.
# Brings up the database (and broker) so you can run migrations and the services.
#   docker compose up -d            # start db + broker
#   make migrate-up                 # apply schema (goose)
#
# In production the broker is exposed over TLS (8883) with per-device auth; this
# local config is plaintext on the LAN only. See PRODUCT.md "Deployment".

services:
  postgres:
    image: postgres:16-alpine
    container_name: crowbot-postgres
    environment:
      POSTGRES_USER: crowbot
      POSTGRES_PASSWORD: crowbot
      POSTGRES_DB: crowbot
    ports:
      - "5433:5432"   # host 5433 (5432 may be taken by another local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowbot -d crowbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: crowbot-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over websockets
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
